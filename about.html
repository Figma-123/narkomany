<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>О разработчиках</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .developers {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            width: 250px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4a90d9;
        }
        .card h2 {
            font-size: 18px;
            margin: 12px 0 6px;
            color: #222;
        }
        .card p {
            margin: 4px 0;
            color: #666;
        }
        .age {
            font-weight: bold;
            color: #4a90d9;
        }
    </style>
</head>
<body>

    <h1>Наши разработчики</h1>

    <div class="developers">

        <!-- Разработчик 1 -->
        <div class="card">
            <img src="images/ivanov.jpg" alt="Фото Иванова Ивана">
            <h2>Иванов Иван Иванович</h2>
            <p class="age">Возраст: 21 год</p>
            <p>Роль: Frontend-разработчик</p>
        </div>

        <!-- Разработчик 2 -->
        <div class="card">
            <img src="images/petrova.jpg" alt="Фото Петровой Марии">
            <h2>Петрова Мария Сергеевна</h2>
            <p class="age">Возраст: 20 лет</p>
            <p>Роль: Backend-разработчик</p>
        </div>

        <!-- Разработчик 3 -->
        <div class="card">
            <img src="images/sidorov.jpg" alt="Фото Сидорова Алексея">
            <h2>Сидоров Алексей Петрович</h2>
            <p class="age">Возраст: 22 года</p>
            <p>Роль: Дизайнер / QA-инженер</p>
        </div>

    </div>

</body>
</html>
