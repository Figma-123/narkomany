<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            text-align: center;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 10px;
        }

        .contact-item {
            margin: 20px 0;
            font-size: 18px;
        }

        .label {
            font-weight: bold;
            color: #4a90e2;
            display: inline-block;
            min-width: 150px;
        }

        a {
            color: #333;
            text-decoration: none;
        }

            a:hover {
                color: #4a90e2;
                text-decoration: underline;
            }

        /* Стили для футера */
        footer {
            text-align: center;
            padding: 20px;
            background: #4a90e2;
            color: #fff;
            font-size: 14px;
            margin-top: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Контакты</h1>

        <div class="contact-item">
            <span class="label">Адрес:</span>
            220000, г. Минск, ул. Примерная, д. 15, офис 301
        </div>

        <div class="contact-item">
            <span class="label">Телефон:</span>
            <a href="tel:+375291234567">+375 (29) 123-45-67</a>
        </div>
    </div>

    <!-- Футер -->
    <footer>
        © 2026 Разработано студентами группы [Номер]
    </footer>

</body>
</html>
